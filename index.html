<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protetor de Tela GRIS</title>
<style>
*{box-sizing:border-box;}
html,body{height:100%;margin:0;overflow:hidden;user-select:none;-webkit-user-select:none;}
body{
  font-family:Tahoma,Verdana,Arial,sans-serif;
  background:
    radial-gradient(ellipse 120% 40% at 30% 100%, #4f9a2c 0%, #3d8a1f 55%, transparent 56%),
    radial-gradient(ellipse 100% 35% at 90% 105%, #62b13a 0%, #4a9a26 55%, transparent 56%),
    linear-gradient(#2f6fd6 0%, #6aa8f0 55%, #bfe0ff 100%);
}
body.sem-cursor{cursor:none;}

#tela{position:fixed;top:0;left:0;width:100vw;height:calc(100vh - 40px);display:block;}

/* barra de tarefas estilo XP */
#taskbar{
  position:fixed;left:0;right:0;bottom:0;height:40px;display:flex;align-items:stretch;
  background:linear-gradient(#3168d5 0%,#4993e6 8%,#2a69e0 18%,#245edb 50%,#2158d4 90%,#1941a5 100%);
  border-top:1px solid #0c3fb8;z-index:10;
}
#start{
  display:flex;align-items:center;padding:0 22px 0 14px;
  font:italic bold 20px Tahoma,Verdana,sans-serif;color:#fff;text-shadow:1px 1px 2px #1a4d12;
  background:linear-gradient(#5fc34f 0%,#3ea82b 45%,#2f8f1f 100%);
  border-radius:0 14px 14px 0;box-shadow:inset 0 1px 1px rgba(255,255,255,.5),2px 0 4px rgba(0,0,0,.4);
}
#tasks{flex:1;display:flex;align-items:center;padding:0 8px;}
.task{
  height:28px;min-width:160px;display:flex;align-items:center;padding:0 12px;
  color:#fff;font-size:13px;text-shadow:1px 1px 1px #0a2a80;
  background:linear-gradient(#1f4fb3,#2a63d6);border:1px solid #0c3fb8;border-radius:4px;
  box-shadow:inset 0 0 6px rgba(0,0,40,.5);
}
#tray{
  display:flex;align-items:center;gap:10px;padding:0 14px;color:#fff;font-size:13px;
  background:linear-gradient(#0f8ae8 0%,#1a9cf0 15%,#0e84e0 60%,#0a6fc9 100%);
  border-left:1px solid #0a3fa0;box-shadow:inset 1px 0 2px rgba(255,255,255,.4);
}

/* balão de aviso */
#balao{
  position:fixed;right:12px;bottom:50px;width:300px;z-index:11;
  background:#ffffe1;color:#000;border:1px solid #000;border-radius:8px;
  padding:10px 12px 12px;font-size:12px;box-shadow:2px 3px 8px rgba(0,0,0,.45);
}
#balao::after{
  content:"";position:absolute;right:34px;bottom:-11px;width:0;height:0;
  border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid #000;
}
#balao::before{
  content:"";position:absolute;right:35px;bottom:-9px;width:0;height:0;z-index:1;
  border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid #ffffe1;
}
#balao .tit{font-weight:bold;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
#balao .tit .x{
  margin-left:auto;width:16px;height:16px;line-height:14px;text-align:center;cursor:pointer;
  border:1px solid #666;border-radius:3px;font-size:11px;background:#f4f1dc;
}
#balao.oculto{display:none;}

/* diálogo inicial */
#overlay{
  position:fixed;inset:0;z-index:20;background:rgba(0,0,40,.45);
  display:flex;align-items:center;justify-content:center;padding:14px;
}
#overlay.oculto{display:none;}
.dialog{
  width:100%;max-width:420px;background:#ece9d8;border:3px solid #0a3fc4;border-top:0;
  border-radius:9px 9px 4px 4px;box-shadow:4px 6px 18px rgba(0,0,0,.6);
}
.dialog .tb{
  padding:7px 10px;color:#fff;font-weight:bold;font-size:14px;text-shadow:1px 1px 1px #0a2a80;
  background:linear-gradient(#3a8cff 0%,#0a5be0 12%,#0950d4 50%,#0a4bc8 88%,#0b3fa8 100%);
  border-radius:8px 8px 0 0;margin:0 -3px;
}
.dialog .corpo{padding:18px;text-align:center;}
.dialog p{margin:0 0 14px;font-size:13px;line-height:1.4;}
.xp-btn{
  width:100%;padding:11px;font:bold 15px Tahoma,Verdana,sans-serif;color:#fff;cursor:pointer;
  border:1px solid #1a6b0e;border-radius:12px;
  background:linear-gradient(#6fd45a 0%,#3ea82b 50%,#2d8f1c 100%);
  text-shadow:1px 1px 1px #145a0a;box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
}
.xp-btn:hover{filter:brightness(1.08);}
.xp-btn:active{filter:brightness(.92);}
.nota{margin-top:10px;font-size:11px;color:#555;}
#videoFallback{position:fixed;width:2px;height:2px;opacity:.01;pointer-events:none;left:0;top:0;}
</style>
</head>
<body>

<canvas id="tela"></canvas>
<video id="videoFallback" muted playsinline loop></video>

<div id="taskbar">
  <div id="start">iniciar</div>
  <div id="tasks"><div class="task">🫧 Protetor de Tela GRIS</div></div>
  <div id="tray"><span title="Tela ativa">🖥️</span><span id="relogio">--:--</span></div>
</div>

<div id="balao" class="oculto">
  <div class="tit"><span>ℹ️</span><span>Protetor de tela ativo</span><span class="x" id="fecharBalao">✕</span></div>
  Para sair da tela, pressione <b>Alt+Tab</b> ou <b>F11</b>.
</div>

<div id="overlay">
  <div class="dialog">
    <div class="tb">🫧 Protetor de Tela GRIS</div>
    <div class="corpo">
      <p id="overlayTexto">Clique no botão abaixo para ativar a tela cheia e manter a tela sempre acesa.</p>
      <button class="xp-btn" id="btnIniciar">▶ Iniciar em tela cheia</button>
      <div class="nota">Para sair: Alt+Tab ou F11.</div>
    </div>
  </div>
</div>

<script>
(function(){
  var canvas = document.getElementById('tela');
  var ctx = canvas.getContext('2d');
  var ALTURA_BARRA = 40;
  var LETRAS = ['G','R','I','S'];
  var W = 0, H = 0, dpr = 1;
  var bolhas = [];
  var iniciado = false;
  var wakeLock = null;

  function rand(a, b){ return a + Math.random() * (b - a); }

  /* ---------- tamanho ---------- */
  function ajustarCanvas(){
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = Math.max(100, window.innerHeight - ALTURA_BARRA);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bolhas.forEach(function(b){
      b.x = Math.min(Math.max(b.x, b.r), W - b.r);
      b.y = Math.min(Math.max(b.y, b.r), H - b.r);
    });
  }

  /* ---------- bolhas ---------- */
  function criarBolhas(){
    bolhas = [];
    var qtd = Math.max(8, Math.min(20, Math.round((W * H) / 95000)));
    var base = Math.min(W, H);
    for(var i = 0; i < qtd; i++){
      var r = Math.max(32, rand(0.06, 0.12) * base);
      var ok = false, x = 0, y = 0, t = 0;
      while(!ok && t < 80){
        x = rand(r, W - r); y = rand(r, H - r);
        ok = bolhas.every(function(o){
          return Math.hypot(o.x - x, o.y - y) > o.r + r + 4;
        });
        t++;
      }
      var ang = rand(0, Math.PI * 2);
      var vel = rand(35, 170); // px por segundo, aleatória
      bolhas.push({
        x: x, y: y, r: r,
        vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel,
        m: r * r,
        letra: LETRAS[i % LETRAS.length],
        fase: rand(0, Math.PI * 2)
      });
    }
  }

  var VEL_MIN = 30, VEL_MAX = 230;

  function limitarVelocidade(b){
    var s = Math.hypot(b.vx, b.vy);
    if(s < 0.001){
      var a = rand(0, Math.PI * 2);
      b.vx = Math.cos(a) * VEL_MIN; b.vy = Math.sin(a) * VEL_MIN;
      return;
    }
    if(s < VEL_MIN){ b.vx *= VEL_MIN / s; b.vy *= VEL_MIN / s; }
    else if(s > VEL_MAX){ b.vx *= VEL_MAX / s; b.vy *= VEL_MAX / s; }
  }

  function colidir(a, b){
    var dx = b.x - a.x, dy = b.y - a.y;
    var d = Math.hypot(dx, dy);
    var minD = a.r + b.r;
    if(d >= minD) return;
    if(d === 0){ dx = 1; dy = 0; d = 1; }
    var nx = dx / d, ny = dy / d;
    var sobra = minD - d;
    var total = a.m + b.m;
    a.x -= nx * sobra * (b.m / total);
    a.y -= ny * sobra * (b.m / total);
    b.x += nx * sobra * (a.m / total);
    b.y += ny * sobra * (a.m / total);

    var rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
    if(rv < 0){
      var j = -2 * rv / (1 / a.m + 1 / b.m); // choque elástico
      a.vx -= (j / a.m) * nx; a.vy -= (j / a.m) * ny;
      b.vx += (j / b.m) * nx; b.vy += (j / b.m) * ny;
    }
  }

  function atualizar(dt){
    var i, j, b;
    for(i = 0; i < bolhas.length; i++){
      b = bolhas[i];
      // leve deriva aleatória, como bolhas pairando
      var giro = (Math.random() - 0.5) * 0.04;
      var c = Math.cos(giro), s = Math.sin(giro);
      var nvx = b.vx * c - b.vy * s, nvy = b.vx * s + b.vy * c;
      b.vx = nvx; b.vy = nvy;

      b.x += b.vx * dt;
      b.y += b.vy * dt;

      if(b.x - b.r < 0){ b.x = b.r; b.vx = Math.abs(b.vx); }
      if(b.x + b.r > W){ b.x = W - b.r; b.vx = -Math.abs(b.vx); }
      if(b.y - b.r < 0){ b.y = b.r; b.vy = Math.abs(b.vy); }
      if(b.y + b.r > H){ b.y = H - b.r; b.vy = -Math.abs(b.vy); }
    }
    for(i = 0; i < bolhas.length; i++){
      for(j = i + 1; j < bolhas.length; j++){ colidir(bolhas[i], bolhas[j]); }
    }
    for(i = 0; i < bolhas.length; i++){ limitarVelocidade(bolhas[i]); }
  }

  function desenharBolha(b, t){
    var r = b.r * (1 + 0.015 * Math.sin(t * 1.6 + b.fase));
    ctx.save();
    ctx.translate(b.x, b.y);

    // corpo translúcido com borda iridescente
    var g = ctx.createRadialGradient(0, 0, r * 0.05, 0, 0, r);
    g.addColorStop(0,    'rgba(255,255,255,0.06)');
    g.addColorStop(0.65, 'rgba(160,210,255,0.14)');
    g.addColorStop(0.85, 'rgba(255,150,225,0.26)');
    g.addColorStop(0.94, 'rgba(120,255,225,0.38)');
    g.addColorStop(1,    'rgba(255,255,255,0.65)');
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(255,255,255,0.75)';
    ctx.stroke();

    // brilhos
    ctx.beginPath();
    ctx.ellipse(-r * 0.38, -r * 0.45, r * 0.2, r * 0.1, -0.7, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(r * 0.42, r * 0.42, r * 0.09, r * 0.05, -0.7, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fill();

    // letra
    ctx.font = 'bold ' + Math.round(r * 0.95) + 'px Tahoma, Verdana, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(2, r * 0.06);
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.strokeText(b.letra, 0, r * 0.04);
    ctx.fillStyle = 'rgba(10,60,160,0.9)';
    ctx.fillText(b.letra, 0, r * 0.04);

    ctx.restore();
  }

  var ultimo = 0;
  function loop(agora){
    var dt = Math.min(0.05, (agora - ultimo) / 1000 || 0.016);
    ultimo = agora;
    atualizar(dt);
    ctx.clearRect(0, 0, W, H);
    for(var i = 0; i < bolhas.length; i++){ desenharBolha(bolhas[i], agora / 1000); }
    requestAnimationFrame(loop);
  }

  /* ---------- manter a tela ativa ---------- */
  function usarFallbackVideo(){
    try {
      var c = document.createElement('canvas');
      c.width = 16; c.height = 16;
      var cx = c.getContext('2d');
      function pintar(){ cx.fillStyle = 'rgb(' + (Math.random()*255|0) + ',80,160)'; cx.fillRect(0, 0, 16, 16); }
      pintar();
      setInterval(pintar, 1000);
      var v = document.getElementById('videoFallback');
      v.srcObject = c.captureStream(1);
      v.play();
    } catch(e){}
  }

  function pedirWakeLock(){
    if('wakeLock' in navigator){
      navigator.wakeLock.request('screen').then(function(l){
        wakeLock = l;
        l.addEventListener('release', function(){ wakeLock = null; });
      }).catch(function(){ usarFallbackVideo(); });
    } else {
      usarFallbackVideo();
    }
  }
  document.addEventListener('visibilitychange', function(){
    if(iniciado && document.visibilityState === 'visible' && !wakeLock){ pedirWakeLock(); }
  });

  /* ---------- tela cheia ---------- */
  var overlay = document.getElementById('overlay');
  var balao = document.getElementById('balao');

  function entrarTelaCheia(){
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(req){
      try {
        var p = req.call(el);
        if(p && p.catch){ p.catch(function(){}); }
      } catch(e){}
    }
  }

  document.getElementById('btnIniciar').addEventListener('click', function(){
    entrarTelaCheia();
    pedirWakeLock();
    iniciado = true;
    overlay.classList.add('oculto');
    balao.classList.remove('oculto');
    reiniciarCursor();
  });

  document.getElementById('fecharBalao').addEventListener('click', function(){
    balao.classList.add('oculto');
  });

  function aoMudarTelaCheia(){
    var ativa = document.fullscreenElement || document.webkitFullscreenElement;
    if(iniciado && !ativa){
      document.getElementById('overlayTexto').textContent =
        'A tela cheia foi encerrada. Clique para retomar o protetor de tela.';
      document.getElementById('btnIniciar').textContent = '▶ Retomar em tela cheia';
      overlay.classList.remove('oculto');
      balao.classList.add('oculto');
      document.body.classList.remove('sem-cursor');
    } else if(ativa){
      balao.classList.remove('oculto');
    }
    setTimeout(ajustarCanvas, 100);
  }
  document.addEventListener('fullscreenchange', aoMudarTelaCheia);
  document.addEventListener('webkitfullscreenchange', aoMudarTelaCheia);

  /* ---------- cursor some após inatividade ---------- */
  var timerCursor = null;
  function reiniciarCursor(){
    document.body.classList.remove('sem-cursor');
    clearTimeout(timerCursor);
    if(!iniciado) return;
    timerCursor = setTimeout(function(){
      if(overlay.classList.contains('oculto')){ document.body.classList.add('sem-cursor'); }
    }, 3000);
  }
  document.addEventListener('mousemove', reiniciarCursor);

  /* ---------- relógio ---------- */
  function atualizarRelogio(){
    var d = new Date();
    document.getElementById('relogio').textContent =
      (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
  }
  atualizarRelogio();
  setInterval(atualizarRelogio, 10000);

  /* ---------- início ---------- */
  window.addEventListener('resize', ajustarCanvas);
  ajustarCanvas();
  criarBolhas();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
